name: handoff
version: 0.1.0
description: Durable agent bus on the filesystem — atomic post, leased take, ack, and sweep that returns messages from dead consumers. "Not delivered" becomes a state instead of an error.
author: Konstantin Parashchuk (idea), forgessa (plugin)
license: MIT
homepage: https://github.com/kostyk348/tools
tags: [agents, multi-agent, messaging, queue, reliability, filesystem]
kind: standalone
requires_hermes: ">=0.21"
provides_tools:
  - handoff_post
  - handoff_take
  - handoff_ack
  - handoff_nack
  - handoff_sweep
  - handoff_list
  - handoff_stats
  - handoff_wait
